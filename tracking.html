<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live tracking (simulated) — Matatu Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23FFB627%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/tracking.css">
<link rel="stylesheet" href="css/chatbot.css">
</head>
<body>

<header class="topnav">
  <div class="container topnav-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark"><span data-icon="bus"></span></span>
      <span>Matatu Tracker<small>ROUTE · TRACK · TICKET</small></span>
    </a>
    <nav class="navlinks">
      <a href="index.html">Search</a>
      <a href="tracking.html" class="is-active">Live tracking</a>
      <a href="about.html">About</a>
    </nav>
    <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-navigation">
      <span class="nav-toggle-lines"></span>
    </button>
  </div>
</header>

<main class="tracking-main">

  <div class="tracking-toolbar container">
    <div class="tracking-select">
      <label class="field-label" for="route-select">Route</label>
      <select id="route-select"></select>
    </div>
    <div class="tracking-select">
      <label class="field-label" for="vehicle-select">Vehicle</label>
      <select id="vehicle-select"></select>
    </div>
    <div class="tracking-controls">
      <button class="btn btn-ghost btn-sm" id="replay-btn"><span data-icon="replay"></span></button>
      <button class="btn btn-primary btn-sm" id="play-btn"><span data-icon="pause"></span> <span id="play-label">Pause</span></button>
    </div>
  </div>

  <div class="tracking-layout container">
    <div class="map-panel panel">
      <div id="map"></div>
      <div class="map-caption"><span data-icon="info"></span> Simulated movement for demonstration — not a live GPS feed.</div>
    </div>

    <aside class="stops-panel panel">
      <div class="stops-head">
        <span class="ticket-route-no route-badge" id="active-route-badge">—</span>
        <div>
          <h2 id="active-route-name">Loading…</h2>
          <p class="muted" id="active-vehicle-line">—</p>
        </div>
      </div>
      <ol class="stops-list" id="stops-list"></ol>
    </aside>
  </div>

</main>

<footer class="sitefoot">
  <div class="container">
    <span>Matatu Tracker — a BBIT web programming prototype.</span>
    <span>Built with HTML, CSS, JavaScript &amp; Leaflet.js</span>
  </div>
</footer>

<script src="lib/leaflet/leaflet.js"></script>
<script src="js/routes.js"></script>
<script src="js/icons.js"></script>
<script src="js/util.js"></script>
<script src="js/notifications.js"></script>
<script src="js/tracking.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
